# Fork-only: build the macOS arm64 installer (DMG) from source, without publishing.
# Mirrors the macOS steps of release-packages.yml; the result is a workflow artifact.
name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - "build/v0.26.1-648fbf74"

permissions:
  contents: read

concurrency:
  group: build-macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build macos-arm64 DMG
    runs-on: macos-26
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript prerequisites
        run: npm run build:typescript

      - name: Build installer package
        run: npm run release:package -- --target macos-arm64

      - name: Verify signatures in the packaged DMG
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          cd "build/release/$version/macos-arm64"
          dmg="codexhost-$version-macos-arm64.dmg"
          mount_dir=$(mktemp -d "$RUNNER_TEMP/codexhost-dmg.XXXXXX")
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            if [[ -d "$mount_dir" ]]; then rmdir "$mount_dir"; fi
          }
          trap cleanup EXIT
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          app="$mount_dir/codexhost.app"
          shell_path=Contents/Helpers/CodexHost.app
          shell_app="$app/$shell_path"
          test -x "$shell_app/Contents/MacOS/CodexHost"
          lipo "$shell_app/Contents/MacOS/CodexHost" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$shell_app"
          app_cdhash=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^CDHash=//p')
          shell_cdhash=$(codesign -dv --verbose=4 "$shell_app" 2>&1 | sed -n 's/^CDHash=//p')
          [[ "$app_cdhash" =~ ^[0-9a-f]{40}$ && "$shell_cdhash" =~ ^[0-9a-f]{40}$ ]]
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'appCDHash=%s\n' "$app_cdhash"
            printf 'shellPath=%s\n' "$shell_path"
            printf 'shellCDHash=%s\n' "$shell_cdhash"
          } | tee macos-signatures.txt

      - name: Checksums
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          cd "build/release/$version/macos-arm64"
          shasum -a 256 "codexhost-$version-macos-arm64.dmg" | tee SHA256SUMS

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexhost-macos-arm64-dmg
          path: |
            build/release/*/macos-arm64/codexhost-*.dmg
            build/release/*/macos-arm64/SHA256SUMS
            build/release/*/macos-arm64/macos-signatures.txt
          if-no-files-found: error
          retention-days: 14
